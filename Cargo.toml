[package]
name = "voidb-plugin-mongodb"
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for MongoDB document database"
repository = "https://github.com/limmytian/voidb-plugin-mongodb"

[[bin]]
name = "voidb-plugin-mongodb"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", rev = "0d565c4a7227f218c2b9c118aa2694d87243aa8f" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", rev = "0d565c4a7227f218c2b9c118aa2694d87243aa8f" }
mongodb = "3"
bson = "2"
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rpassword = "7"

[dev-dependencies]
toml = "0.8"

[[example]]
name = "export_schemas"
path = "examples/export_schemas.rs"

[[example]]
name = "fixture_smoke"
path = "examples/fixture_smoke.rs"
