[package]
name = "voidb-plugin-mongodb"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for MongoDB document database"
repository = "https://github.com/limmytian/voidb-plugin-mongodb"

[[bin]]
name = "voidb-plugin-mongodb"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.0-rc.1" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.0-rc.1" }
mongodb = "3"
bson = "2"
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]

[[example]]
name = "export_schemas"
path = "examples/export_schemas.rs"

[[example]]
name = "fixture_smoke"
path = "examples/fixture_smoke.rs"

[patch."https://github.com/limmytian/voidb.git"]
voidb-process-plugin-sdk = { path = "../voidb/crates/voidb-process-plugin-sdk" }
voidb-core = { path = "../voidb/crates/voidb-core" }
